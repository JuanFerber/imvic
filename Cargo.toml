[package]
name = "imvic"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "High-performance, modular terminal image viewer with terminal-native graphics presentation and adaptive CPU rasterization"
license = "MIT"
repository = "https://github.com/JuanFerber/imvic"

[dependencies]
# Command-line argument parsing
clap = { version = "4.6", features = ["derive"] }

# High-resolution vector rasterization (SVG)
resvg = "0.48"
tiny-skia = "0.12"

# Pixel buffer operations and PNG compression
image = "0.25"

# Base64 encoding for Kitty Graphics Protocol
base64 = "0.23"

# Terminal control (raw mode, events, alternate screen)
crossterm = "0.29"

# File system watcher for live reloading (latest stable)
notify = "8.2"

# Robust error handling and propagation
anyhow = "1.0"

# Optimize heavy third-party graphics/SIMD dependencies (resvg, tiny-skia, image)
# even during development to maintain smooth interactive framerates while keeping local incremental builds fast.
[profile.dev.package."*"]
opt-level = 3

# Aggressive release profile for vector rasterization and minimal latency terminal display:
# - opt-level = 3: Enables aggressive loop unrolling and SIMD auto-vectorization.
# - lto = "thin": Cross-crate Link-Time Optimization without exorbitant build times.
# - codegen-units = 1: Single code generation unit to maximize global optimization scope.
# - panic = "abort": Strips unwinding landing pads, reducing binary size and call overhead.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
